<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cart | Marketly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <img src="https://images.scalebranding.com/home-shop-logo-846db8c3-82fb-435d-af81-e3cb2f85a597.jpg" alt="logo">
        <div class="brand-text">
          <div class="brand-name">Marketly</div>
          <div class="brand-sub">Handpicked deals</div>
        </div>
      </div>
      <nav class="header-actions">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="account.html">Profile</a>
        <a class="link" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="cart-page">
    <div class="wrap cart-layout">
      
      <section class="cart-items">
        <h1>Your cart</h1>
        <p class="muted small-muted" id="cart-note">your cart is ready </p>

        <div id="cart-items-list"></div>
      </section>

      <aside class="cart-summary" id="cart-summary">
        <h2>Order summary</h2>

        <div class="summary-row">
          <span>Subtotal (<span id="summary-items">0</span> items)</span>
          <span id="summary-subtotal">₹0</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span class="accent">Free</span>
        </div>
        <div class="summary-row">
          <span>Discount</span>
          <span id="summary-discount">₹0</span>
        </div>

        <div class="summary-total">
          <span>Total</span>
          <span id="summary-total">₹0</span>
        </div>

        <button class="btn primary summary-btn" type="button" id="checkout-btn">
          Proceed to checkout
        </button>

        <button class="btn ghost summary-btn" type="button" onclick="window.location.href='index.html'">
          Continue shopping
        </button>
      </aside>

    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div><strong>Marketly</strong></div>
      <div class="muted">© 2025 Marketly</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
