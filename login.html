<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login | Marketly</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand">
        <img src="https://images.scalebranding.com/home-shop-logo-846db8c3-82fb-435d-af81-e3cb2f85a597.jpg" alt="logo">
        <div class="brand-text">
          <div class="brand-name">Marketly</div>
          <div class="brand-sub">Handpicked deals</div>
        </div>
      </div>
      <nav class="header-actions">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="account.html">Profile</a>
        <a class="link" href="cart.html">Cart (<span class="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="wrap">
      <div class="auth-card">
        <h1>Sign in</h1>
        <p class="muted">Welcome back! Please sign in to continue.</p>

        <form class="auth-form" action="#" method="post">
          <div class="auth-field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn primary auth-btn">Sign in</button>

          <p class="auth-small">
            Don't have an account? <a href="#">Create one</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div><strong>Marketly</strong></div>
      <div class="muted">© 2025 Marketly</div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
